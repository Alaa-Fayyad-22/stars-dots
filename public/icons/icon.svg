<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Stars & Dots app icon. Solid dark-green background, an amber star and steel-blue dots
       (the game's own dark-theme colors). Everything sits inside the center 80% (a circle of
       radius 205 around the middle), so the same artwork works as a maskable icon. -->
  <rect width="512" height="512" fill="#10160f"/>
  <!-- star: outer radius 136, inner 56, centered a little above the middle -->
  <polygon fill="#f0b23a" stroke="#f0b23a" stroke-width="14" stroke-linejoin="round"
    points="256.0,78.0 288.9,168.7 385.3,172.0 309.3,231.3 335.9,324.0 256.0,270.0 176.1,324.0 202.7,231.3 126.7,172.0 223.1,168.7"/>
  <!-- dots -->
  <circle cx="180" cy="396" r="38" fill="#6badd6"/>
  <circle cx="332" cy="396" r="38" fill="#6badd6"/>
</svg>
